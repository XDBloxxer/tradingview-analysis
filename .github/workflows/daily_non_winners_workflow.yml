name: Daily Non-Winners Tracker

on:
  # Run daily at 5:00 PM EST (after daily winners at 4:30 PM)
  schedule:
    - cron: '20 21 * * 1-5'  # 21:20 UTC = 4:20 PM EST -- 30 min after daily_top10.yml's 20:50 UTC winners run, so _get_winners_symbols() always sees that day's winners already written (Mon-Fri only)
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, leave empty for today). Ignored if start_date is set.'
        required: false
        default: ''
      start_date:
        description: 'Backfill: range start date (YYYY-MM-DD). Requires end_date. Runs every trading day in [start_date, end_date].'
        required: false
        default: ''
      end_date:
        description: 'Backfill: range end date (YYYY-MM-DD). Requires start_date.'
        required: false
        default: ''
      chunk_days:
        description: 'Backfill only: split start_date..end_date into separate queued runs of this many calendar days each (e.g. 7). Leave empty/0 to run the whole range as a single job.'
        required: false
        default: ''
      top_n:
        description: 'Number of non-winners to track'
        required: false
        default: '100'
      allow_append:
        description: 'Allow appending stocks to dates that already exist in the database (manual runs only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_queue:
        description: 'Backfill only: run immediately in this job instead of going through the shared queue. Use for one-off/urgent backfills; leave off for routine/large backfills so they share the queue nicely with other runs.'
        required: false
        default: false
        type: boolean

# Same reasoning as daily_top10.yml -- this job only enqueues one or more
# chunks into the shared data/run_queue.jsonl and wakes queue_runner.yml,
# which is the workflow that actually holds the "tv-analysis-backfill"
# concurrency group and does the work. No concurrency block here on purpose;
# see queue_runner.yml.
permissions:
  contents: write
  actions: write

# Our git steps (reset/pull/commit/push) never touch anything under
# ml_models/ -- the only Git LFS-tracked path in this repo -- so skip
# LFS smudging entirely. Without this, git-lfs's smudge filter runs on
# every checkout/reset/pull regardless of the "lfs:" flag on
# actions/checkout, and a pre-existing broken LFS pointer elsewhere in
# the repo (ml_models/archive/*.pkl committed as a raw binary instead
# of a pointer) makes "git reset --hard" leave the tree in a state
# "git pull --rebase" then refuses to touch.
env:
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  enqueue-non-winners:
    if: github.event.inputs.skip_queue != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Append job(s) to shared run queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ml_models/archive/best_model - Copy.pkl was committed as a raw
          # binary instead of a real LFS pointer. The problem is that git
          # doesn't scope its checks to what a job actually touches -- every
          # "git reset --hard" / "git pull --rebase" reconciles the ENTIRE
          # working tree against the target commit, so it always walks past
          # this file even though this job never reads or writes anything
          # under ml_models/. Overriding filter.lfs.* config is unreliable
          # across git/git-lfs versions (it kept getting bypassed). The robust
          # fix: use sparse-checkout to tell git to never materialize
          # ml_models/ in the working tree for this job at all. If the file
          # is never checked out, there's nothing to smudge/diff/complain
          # about -- the problem structurally can't occur.
          git sparse-checkout init --no-cone
          printf '/*\n!/ml_models/\n' > .git/info/sparse-checkout
          git sparse-checkout reapply

          for i in 1 2 3 4 5; do
            # Defensive: force the working tree to exactly match whatever is
            # currently checked out before pulling. Without this, any
            # pre-existing diff in a tracked file (e.g. a line-ending quirk
            # in one of the selection-counts JSON files) makes git refuse to
            # even start "pull --rebase" with "You have unstaged changes",
            # before this script has touched anything itself.
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin "${{ github.ref_name }}"

            JOB_IDS=$(python src/queue_worker.py enqueue-range \
              --job-type non_winners \
              --date "${{ github.event.inputs.date }}" \
              --start-date "${{ github.event.inputs.start_date }}" \
              --end-date "${{ github.event.inputs.end_date }}" \
              --chunk-days "${{ github.event.inputs.chunk_days }}" \
              --top-n "${{ github.event.inputs.top_n || '60' }}" \
              --allow-append "${{ github.event.inputs.allow_append || 'false' }}" \
              --queued-by "non_winners:${{ github.run_id }}")

            git add -f data/run_queue.jsonl
            NUM_JOBS=$(echo "$JOB_IDS" | grep -c .)
            git commit -m "chore: enqueue $NUM_JOBS non-winners job(s) [skip ci]"

            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Enqueued:"
              echo "$JOB_IDS"
              break
            fi

            echo "Push attempt $i failed (likely a race with another enqueue), retrying..."
            git reset --hard HEAD~1
            sleep $((RANDOM % 5 + 2))
          done

      - name: Wake up the queue runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run queue_runner.yml --ref "${{ github.ref_name }}"

  # Bypasses data/run_queue.jsonl and queue_runner.yml entirely and just runs
  # daily_non_winners_main.py directly in this job. Uses its OWN concurrency
  # group -- separate from queue_runner.yml's "tv-analysis-backfill" and from
  # the winners direct-run's group -- so a non-winners direct-run and a
  # winners direct-run (or a queue drain) can all proceed at the same time;
  # they touch different Supabase tables and different local files
  # (non_winner_selection_counts.json vs winner_selection_counts.json), so
  # there's nothing to actually race on. This group only serializes repeat
  # non-winners-direct triggers against each other, so you don't accidentally
  # double-run the same backfill.
  run-directly:
    if: github.event.inputs.skip_queue == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: tv-analysis-direct-non-winners
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p data/cache
          mkdir -p logs

      - name: Run non-winners tracker directly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS=(--verbose --top-n "${{ github.event.inputs.top_n || '60' }}")
          if [ -n "${{ github.event.inputs.start_date }}" ] && [ -n "${{ github.event.inputs.end_date }}" ]; then
            ARGS+=(--start-date "${{ github.event.inputs.start_date }}" --end-date "${{ github.event.inputs.end_date }}")
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS+=(--date "${{ github.event.inputs.date }}")
          fi
          if [ "${{ github.event.inputs.allow_append || 'false' }}" = "true" ]; then
            ARGS+=(--allow-append)
          fi
          python daily_non_winners_main.py "${ARGS[@]}"

      - name: Commit any local changes (e.g. selection-counts JSON)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Now that this job has its own concurrency group, it can genuinely
          # run at the same moment as the winners direct-run and/or
          # queue_runner.yml -- all three push to the same branch, so a
          # single unconditional push here could lose the race. Same
          # retry-with-jitter pattern as the enqueue workflows.
          for i in 1 2 3 4 5; do
            git add -A
            git diff --cached --quiet && NOTHING_TO_COMMIT=1 || NOTHING_TO_COMMIT=0
            if [ "$NOTHING_TO_COMMIT" = "0" ]; then
              git commit -m "chore: non-winners direct run [skip ci]"
            fi

            git pull --rebase origin "${{ github.ref_name }}"

            if [ "$NOTHING_TO_COMMIT" = "1" ]; then
              echo "Nothing to commit."
              break
            fi

            if git push origin "HEAD:${{ github.ref_name }}"; then
              break
            fi

            echo "Push attempt $i failed (likely a race with another run), retrying..."
            git reset --hard HEAD~1
            sleep $((RANDOM % 5 + 2))
          done

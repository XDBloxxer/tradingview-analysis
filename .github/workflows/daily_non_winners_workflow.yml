name: Daily Non-Winners Tracker

on:
  # Run daily at 5:00 PM EST (after daily winners at 4:30 PM)
  schedule:
    - cron: '20 21 * * 1-5'  # 21:20 UTC = 4:20 PM EST -- 30 min after daily_top10.yml's 20:50 UTC winners run, so _get_winners_symbols() always sees that day's winners already written (Mon-Fri only)
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, leave empty for today). Ignored if start_date is set.'
        required: false
        default: ''
      start_date:
        description: 'Backfill: range start date (YYYY-MM-DD). Requires end_date. Runs every trading day in [start_date, end_date].'
        required: false
        default: ''
      end_date:
        description: 'Backfill: range end date (YYYY-MM-DD). Requires start_date.'
        required: false
        default: ''
      top_n:
        description: 'Number of non-winners to track'
        required: false
        default: '100'
      allow_append:
        description: 'Allow appending stocks to dates that already exist in the database (manual runs only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Same group name as daily_top10.yml -- see that file for why this is
# shared across both workflows rather than per-workflow.
concurrency:
  group: tv-analysis-backfill
  cancel-in-progress: false

jobs:
  track-non-winners:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create directories
        run: |
          mkdir -p data/cache
          mkdir -p logs
      
      - name: Run daily non-winners tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS="--verbose --top-n ${{ github.event.inputs.top_n || '60' }}"

          if [ -n "${{ github.event.inputs.start_date }}" ] && [ -n "${{ github.event.inputs.end_date }}" ]; then
            ARGS="$ARGS --start-date ${{ github.event.inputs.start_date }} --end-date ${{ github.event.inputs.end_date }}"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi

          if [ "${{ github.event.inputs.allow_append }}" = "true" ]; then
            ARGS="$ARGS --allow-append"
          fi
          
          echo "Running with args: $ARGS"
          python daily_non_winners_main.py $ARGS

      - name: Persist selection counts
        # Same reasoning as the winners workflow: without committing
        # data/non_winner_selection_counts.json back, every chunk of a
        # multi-run backfill starts with an empty counts file and the
        # MAX_USES_PER_SYMBOL cap effectively resets each time -- this
        # matters more here since non-winners is 100% sampled (not real
        # winners), so it's the only thing preventing the same easy-to-pick
        # stocks from dominating across the whole backfill.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/non_winner_selection_counts.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change to selection counts, nothing to commit."
          else
            git commit -m "chore: update non-winner selection counts [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && \
              git push origin "HEAD:${{ github.ref_name }}" && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-winners-logs
          path: logs/
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "Daily non-winners tracker failed. Check logs for details."
          echo "Data may still be partially saved in Supabase."

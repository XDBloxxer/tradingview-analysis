name: Daily Non-Winners Tracker

on:
  # Run daily at 5:00 PM EST (after daily winners at 4:30 PM)
  schedule:
    - cron: '43 20 * * 1-5'  # 20:43 UTC = 4:43 PM EST -- ~26 min after daily_top10.yml's 20:17 UTC run, so _get_winners_symbols() always sees that day's winners already written (Mon-Fri only). Offset from :20 to avoid GitHub's round-minute scheduling congestion.
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, leave empty for today). Ignored if start_date is set.'
        required: false
        default: ''
      start_date:
        description: 'Backfill: range start date (YYYY-MM-DD). Requires end_date. Runs every trading day in [start_date, end_date].'
        required: false
        default: ''
      end_date:
        description: 'Backfill: range end date (YYYY-MM-DD). Requires start_date.'
        required: false
        default: ''
      top_n:
        description: 'Number of non-winners to track'
        required: false
        default: '100'
      allow_append:
        description: 'Allow appending stocks to dates that already exist in the database (manual runs only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Runs daily_non_winners_main.py directly -- no queue, no queue_runner.yml
# involvement. Removed 2026-08-31: the queue system (data/run_queue.jsonl +
# queue_runner.yml) was holding a runner busy for long, unpredictable
# stretches, which was starving this repo's OTHER schedule-triggered
# workflows of runner availability and delaying them by 10+ hours. Since
# winners and non-winners write to different Supabase tables and different
# local files (winner_selection_counts.json vs non_winner_selection_counts.json),
# there was never actually a race between them that required serializing
# through a shared queue -- each just needs to not race against a second
# copy of ITSELF, which the concurrency group below handles.
permissions:
  contents: write

jobs:
  run-non-winners-tracker:
    runs-on: ubuntu-latest
    concurrency:
      group: tv-analysis-non-winners
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p data/cache
          mkdir -p logs

      - name: Run non-winners tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS=(--verbose --top-n "${{ github.event.inputs.top_n || '60' }}")
          if [ -n "${{ github.event.inputs.start_date }}" ] && [ -n "${{ github.event.inputs.end_date }}" ]; then
            ARGS+=(--start-date "${{ github.event.inputs.start_date }}" --end-date "${{ github.event.inputs.end_date }}")
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS+=(--date "${{ github.event.inputs.date }}")
          fi
          if [ "${{ github.event.inputs.allow_append || 'false' }}" = "true" ]; then
            ARGS+=(--allow-append)
          fi
          python daily_non_winners_main.py "${ARGS[@]}"

      - name: Commit any local changes (e.g. selection-counts JSON)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            git add -A
            git diff --cached --quiet && NOTHING_TO_COMMIT=1 || NOTHING_TO_COMMIT=0
            if [ "$NOTHING_TO_COMMIT" = "0" ]; then
              git commit -m "chore: non-winners run [skip ci]"
            fi

            git pull --rebase origin "${{ github.ref_name }}"

            if [ "$NOTHING_TO_COMMIT" = "1" ]; then
              echo "Nothing to commit."
              break
            fi

            if git push origin "HEAD:${{ github.ref_name }}"; then
              break
            fi

            echo "Push attempt $i failed (likely a race with another run), retrying..."
            git reset --hard HEAD~1
            sleep $((RANDOM % 5 + 2))
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-winners-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30

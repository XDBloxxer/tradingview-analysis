name: Daily Non-Winners Tracker

on:
  # Run daily at 5:00 PM EST (after daily winners at 4:30 PM)
  schedule:
    - cron: '20 21 * * 1-5'  # 21:20 UTC = 4:20 PM EST -- 30 min after daily_top10.yml's 20:50 UTC winners run, so _get_winners_symbols() always sees that day's winners already written (Mon-Fri only)
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, leave empty for today). Ignored if start_date is set.'
        required: false
        default: ''
      start_date:
        description: 'Backfill: range start date (YYYY-MM-DD). Requires end_date. Runs every trading day in [start_date, end_date].'
        required: false
        default: ''
      end_date:
        description: 'Backfill: range end date (YYYY-MM-DD). Requires start_date.'
        required: false
        default: ''
      chunk_days:
        description: 'Backfill only: split start_date..end_date into separate queued runs of this many calendar days each (e.g. 7). Leave empty/0 to run the whole range as a single job.'
        required: false
        default: ''
      top_n:
        description: 'Number of non-winners to track'
        required: false
        default: '100'
      allow_append:
        description: 'Allow appending stocks to dates that already exist in the database (manual runs only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Same reasoning as daily_top10.yml -- this job only enqueues one or more
# chunks into the shared data/run_queue.jsonl and wakes queue_runner.yml,
# which is the workflow that actually holds the "tv-analysis-backfill"
# concurrency group and does the work. No concurrency block here on purpose;
# see queue_runner.yml.
permissions:
  contents: write
  actions: write

# Our git steps (reset/pull/commit/push) never touch anything under
# ml_models/ -- the only Git LFS-tracked path in this repo -- so skip
# LFS smudging entirely. Without this, git-lfs's smudge filter runs on
# every checkout/reset/pull regardless of the "lfs:" flag on
# actions/checkout, and a pre-existing broken LFS pointer elsewhere in
# the repo (ml_models/archive/*.pkl committed as a raw binary instead
# of a pointer) makes "git reset --hard" leave the tree in a state
# "git pull --rebase" then refuses to touch.
env:
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  enqueue-non-winners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Append job(s) to shared run queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # GIT_LFS_SKIP_SMUDGE only skips the smudge filter on checkout -- it
          # does NOT stop Git LFS's post-checkout/post-merge hooks, which still
          # run after every "git reset --hard" and inspect LFS-tracked paths.
          # Because ml_models/archive/best_model - Copy.pkl was committed as a
          # raw binary instead of a real pointer, that hook flags it ("should
          # have been a pointer, but wasn't") and leaves the tree diverged from
          # the index again right after our own reset --hard runs -- so the
          # very next "git pull --rebase" sees fresh unstaged changes and
          # aborts. This job never touches ml_models/, so just remove the
          # local LFS hooks entirely and avoid the problem outright.
          git lfs uninstall --local

          for i in 1 2 3 4 5; do
            # Defensive: force the working tree to exactly match whatever is
            # currently checked out before pulling. Without this, any
            # pre-existing diff in a tracked file (e.g. a line-ending quirk
            # in one of the selection-counts JSON files) makes git refuse to
            # even start "pull --rebase" with "You have unstaged changes",
            # before this script has touched anything itself.
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin "${{ github.ref_name }}"

            JOB_IDS=$(python src/queue_worker.py enqueue-range \
              --job-type non_winners \
              --date "${{ github.event.inputs.date }}" \
              --start-date "${{ github.event.inputs.start_date }}" \
              --end-date "${{ github.event.inputs.end_date }}" \
              --chunk-days "${{ github.event.inputs.chunk_days }}" \
              --top-n "${{ github.event.inputs.top_n || '60' }}" \
              --allow-append "${{ github.event.inputs.allow_append || 'false' }}" \
              --queued-by "non_winners:${{ github.run_id }}")

            git add -f data/run_queue.jsonl
            NUM_JOBS=$(echo "$JOB_IDS" | grep -c .)
            git commit -m "chore: enqueue $NUM_JOBS non-winners job(s) [skip ci]"

            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Enqueued:"
              echo "$JOB_IDS"
              break
            fi

            echo "Push attempt $i failed (likely a race with another enqueue), retrying..."
            git reset --hard HEAD~1
            sleep $((RANDOM % 5 + 2))
          done

      - name: Wake up the queue runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run queue_runner.yml --ref "${{ github.ref_name }}"

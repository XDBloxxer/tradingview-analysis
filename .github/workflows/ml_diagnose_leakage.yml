name: ML Diagnose Feature Leakage

# One-off diagnostic: computes per-feature univariate AUC and per-feature
# NaN-rate gap between classes, on the same train-only slice
# feature_selection.py uses. Run this manually whenever RFECV/Boruta AUC
# looks suspiciously high (e.g. ~0.999) even after the symbol-purge +
# embargo leak guards are confirmed active, to check whether the leak is
# baked into a specific feature or into missingness patterns instead of
# time/symbol adjacency.
#
# This is read-only: it does not write or commit anything, just prints a
# report and uploads it as a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of T-1/base history to fetch (0 = unbounded)'
        required: false
        default: '365'
        type: string

permissions:
  contents: read

jobs:
  diagnose-leakage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run leakage diagnostic
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TZ: 'America/New_York'
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '365' }}
        run: |
          python diagnose_feature_leakage.py | tee leakage_report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leakage-report
          path: leakage_report.txt
          retention-days: 30

name: ML Weekly Retraining

on:
  schedule:
    # Every Sunday at 07:00 UTC = 2:00 AM EST = 9:00 AM Estonia
    - cron: '0 7 * * 0'
  
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days of training data to use'
        required: false
        default: '180'
        type: string
      use_all_timepoints:
        description: 'Use all timepoints (day_prior_close + day_prior_open)'
        required: false
        default: true
        type: boolean
      use_selected_features:
        description: 'Restrict to ml_models/feature_selection/selected_features.json (produced by the ML Feature Selection workflow) instead of all ~395 features'
        required: false
        default: true
        type: boolean
      use_learned_filters:
        description: 'Use ml_models/learned_filters.json for filter-aware hard-negative sampling during retraining'
        required: false
        default: false
        type: boolean

# CRITICAL: Grant write permissions to push model updates
permissions:
  contents: write

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Retrain model with latest data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TZ: 'America/New_York'
          # Defaults to 'true' on the scheduled run so weekly retrains
          # automatically pick up whatever the ML Feature Selection workflow
          # last committed. Explicit workflow_dispatch input overrides this.
          # prepare_features() falls back to the full feature set with a
          # warning if selected_features.json doesn't exist yet, so this is
          # safe even before feature selection has ever been run.
          USE_SELECTED_FEATURES: ${{ github.event.inputs.use_selected_features || 'true' }}
          # Filter-aware hard-negative sampling using ml_models/learned_filters.json.
          # Disabled by default on the scheduled run; opt in via workflow_dispatch.
          USE_LEARNED_FILTERS: ${{ github.event.inputs.use_learned_filters || 'false' }}
        run: |
          LOOKBACK="${{ github.event.inputs.lookback_days }}"
          USE_ALL="${{ github.event.inputs.use_all_timepoints }}"
          
          if [ -z "$LOOKBACK" ]; then
            LOOKBACK=180
          fi
          
          if [ "$USE_ALL" = "true" ]; then
            python ml_retrain_model.py --verbose --lookback-days "$LOOKBACK" --use-all-timepoints
          else
            python ml_retrain_model.py --verbose --lookback-days "$LOOKBACK"
          fi
      
      - name: Update screening filters based on model
        run: |
          # Extract learned filters from model metadata and update config
          echo "Model retrained with updated filters"
      
      - name: Commit updated model files
        run: |
          # Ensure LFS is initialised in this checkout so that `git add` on
          # *.pkl files writes LFS pointers rather than raw binary blobs.
          git lfs install

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          # Stage model files — *.pkl are routed through LFS by .gitattributes,
          # so only ~130-byte pointer files land in the regular git object store.
          # ml_models/archive/ is .gitignored; the archive is preserved as a
          # GitHub Actions artifact instead (see "Upload model archive" step).
          git add ml_models/best_model.pkl    || true
          git add ml_models/scaler.pkl        || true
          git add ml_models/gain_regressor.pkl || true
          git add ml_models/model_metadata.json || true
          git add ml_models/feature_importance.csv || true
          git add ml_models/learned_filters.json   || true

          # Commit if there are changes
          git diff --staged --quiet || git commit -m "🤖 Auto-retrain: $(date +'%Y-%m-%d %H:%M:%S UTC')"
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
      
      - name: Upload training logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retraining-logs-${{ github.run_number }}
          path: logs/
          retention-days: 90
      
      - name: Upload model archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-archive-${{ github.run_number }}
          path: ml_models/archive/
          retention-days: 90
      
      - name: Generate performance report
        if: success()
        run: |
          echo "::notice::Model retraining completed successfully"
          echo "::notice::Check ml_models/model_metadata.json for new model stats"

name: ML Screen & Predict (Complete System)

on:
  schedule:
    # Run at 7:00 AM UTC = 2:00 AM EST (1 hour before pre-market at 4 AM EST)
    # This gives predictions before pre-market opens
    - cron: '0 2 * * 1-5'  # Mon-Fri at 7:00 AM UTC
  
  workflow_dispatch:
    inputs:
      top_n:
        description: 'Number of top predictions to store'
        required: false
        default: '50'
        type: string
      t1_limit:
        description: >
          Max stocks to enrich with T-1 yfinance intraday data.
          Stocks beyond this rank (by relative volume) are scored on TV
          screener features only. Set to 0 to enrich all screened stocks
          (slower — budget ~0.15 s per stock beyond the default 500).
        required: false
        default: '500'
        type: string
      t1_workers:
        description: 'Parallel threads for T-1 yfinance fetches (default: 5)'
        required: false
        default: '5'
        type: string
      force:
        description: 'Run even on market holidays (bypasses holiday guard)'
        required: false
        default: 'false'
        type: boolean

jobs:
  screen-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true  # For model files
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir tradingview-scraper>=0.4.19
          pip install -r requirements.txt
      
      - name: Run ML screening & prediction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TZ: 'America/New_York'
        run: |
          TOP_N="${{ github.event.inputs.top_n }}"
          T1_LIMIT="${{ github.event.inputs.t1_limit }}"
          T1_WORKERS="${{ github.event.inputs.t1_workers }}"
          FORCE="${{ github.event.inputs.force }}"

          if [ -z "$TOP_N" ];     then TOP_N="50";    fi
          if [ -z "$T1_LIMIT" ];  then T1_LIMIT="500"; fi
          if [ -z "$T1_WORKERS" ]; then T1_WORKERS="5"; fi

          FORCE_FLAG=""
          if [ "$FORCE" = "true" ]; then FORCE_FLAG="--force"; fi

          python ml_screen_and_predict.py \
            --max-results 1500 \
            --top-n "$TOP_N" \
            --t1-limit "$T1_LIMIT" \
            --t1-workers "$T1_WORKERS" \
            $FORCE_FLAG \
            --verbose
      
      - name: Upload screening results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-results-${{ github.run_number }}
          path: ml_screening_results_*.csv
          retention-days: 30
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::ML screening failed. Check logs for details."

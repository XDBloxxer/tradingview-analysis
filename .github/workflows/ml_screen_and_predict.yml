name: ML Screen & Predict (Complete System)

on:
  schedule:
    # Run at 7:00 AM UTC = 2:00 AM EST (1 hour before pre-market at 4 AM EST)
    # This gives predictions before pre-market opens
    - cron: '0 3 * * 1-5'  # Mon-Fri at 7:00 AM UTC
  
  workflow_dispatch:
    inputs:
      top_n:
        description: 'Number of top predictions to store'
        required: false
        default: '50'
        type: string

jobs:
  screen-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true  # For model files
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir tradingview-scraper>=0.4.19
          pip install -r requirements.txt
      
      - name: Run ML screening & prediction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TZ: 'America/New_York'
        run: |
          TOP_N="${{ github.event.inputs.top_n }}"
          
          if [ -z "$TOP_N" ]; then
            TOP_N="50"
          fi
          
          python ml_screen_and_predict.py \
            --max-results 500 \
            --top-n "$TOP_N" \
            --verbose
      
      - name: Upload screening results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-results-${{ github.run_number }}
          path: ml_screening_results_*.csv
          retention-days: 30
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::ML screening failed. Check logs for details."

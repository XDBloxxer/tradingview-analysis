name: ML Track Comprehensive Accuracy

on:
  schedule:
    # Run AFTER market close and daily winners collection
    # 03:30 UTC = 10:30 PM EST (winter) / 11:30 PM EDT (summer) = 5:30/6:30 AM Estonia
    - cron: '30 3 * * 2-6'  # Tue-Sat (after Mon-Fri market close)
  
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to check (YYYY-MM-DD) - defaults to yesterday'
        required: false
        type: string

jobs:
  track-comprehensive-accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Track comprehensive accuracy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TZ: 'America/New_York'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python ml_track_comprehensive_accuracy.py --verbose --date "${{ github.event.inputs.date }}"
          else
            python ml_track_comprehensive_accuracy.py --verbose
          fi
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-tracking-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Accuracy tracking failed. Check logs for details."

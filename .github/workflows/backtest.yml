name: Run Strategy Backtest

on:
  # Allow manual triggering with parameters
  workflow_dispatch:
    inputs:
      strategy_id:
        description: 'Strategy ID from database'
        required: true
        type: string
      verbose:
        description: 'Enable verbose logging'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  backtest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create directories
        run: |
          mkdir -p logs
      
      - name: Fetch strategy from database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import os
          import json
          from backtesting.backtest_supabase_client import BacktestSupabaseClient
          
          config = {'backtesting': {}}
          client = BacktestSupabaseClient(config)
          strategy = client.get_strategy(${{ github.event.inputs.strategy_id }})
          
          if not strategy:
              print('Strategy not found!')
              exit(1)
          
          # Save strategy config to file
          with open('strategy_config.json', 'w') as f:
              json.dump(strategy, f)
          
          print(f\"Found strategy: {strategy['name']}\")
          "
      
      - name: Run backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import json
          from backtest_runner import run_backtest
          
          # Load strategy config
          with open('strategy_config.json', 'r') as f:
              strategy = json.load(f)
          
          # Run backtest
          result = run_backtest(strategy)
          print(f\"Backtest completed! Strategy ID: {result['strategy_id']}\")
          "
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-logs
          path: logs/
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "Backtest failed. Check logs for details."
          echo "Results may still be partially saved in Supabase."

# Note: You can also schedule backtests to run automatically
# Uncomment and customize this section:
#
# on:
#   schedule:
#     # Run daily at 6 AM EST
#     - cron: '0 11 * * *'  # 11:00 UTC = 6:00 AM EST

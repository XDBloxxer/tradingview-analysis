name: Run Strategy Backtest

on:
  # Allow manual triggering with parameters
  workflow_dispatch:
    inputs:
      strategy_id:
        description: 'Strategy ID from database'
        required: true
        type: string
      verbose:
        description: 'Enable verbose logging'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  backtest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create directories
        run: |
          mkdir -p logs
      
      - name: Run backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS="--strategy-id ${{ github.event.inputs.strategy_id }}"
          
          if [ "${{ github.event.inputs.verbose }}" == "true" ]; then
            ARGS="$ARGS --verbose"
          fi
          
          echo "Running backtest with args: $ARGS"
          python backtest_runner.py $ARGS
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-logs
          path: logs/
          retention-days: 30
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "Backtest failed. Check logs for details."
          echo "Results may still be partially saved in Supabase."

# Note: You can also schedule backtests to run automatically
# Uncomment and customize this section:
#
# on:
#   schedule:
#     # Run daily at 6 AM EST
#     - cron: '0 11 * * *'  # 11:00 UTC = 6:00 AM EST

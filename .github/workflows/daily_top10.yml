name: Daily Winners Tracker

on:
  # Run daily at 4:30 PM EST (after market close at 4pm)
  schedule:
    - cron: '50 20 * * 1-5'  # 21:30 UTC = 4:30 PM EST (Mon-Fri only)

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, leave empty for today). Ignored if start_date is set.'
        required: false
        default: ''
      start_date:
        description: 'Backfill: range start date (YYYY-MM-DD). Requires end_date. Runs every trading day in [start_date, end_date].'
        required: false
        default: ''
      end_date:
        description: 'Backfill: range end date (YYYY-MM-DD). Requires start_date.'
        required: false
        default: ''
      chunk_days:
        description: 'Backfill only: split start_date..end_date into separate queued runs of this many calendar days each (e.g. 7). Leave empty/0 to run the whole range as a single job.'
        required: false
        default: ''
      top_n:
        description: 'Number of top winners to track'
        required: false
        default: '15'
      allow_append:
        description: 'Allow appending to dates that already have data (use when re-running a backfill after a partial failure)'
        required: false
        default: 'false'
        type: boolean

# This job does NOT actually run the tracker anymore -- it just appends one
# or more job descriptions to data/run_queue.jsonl (one per chunk, if
# chunk_days was given for a backfill) and wakes up queue_runner.yml, which
# is the only workflow that does real work and holds the shared
# "tv-analysis-backfill" concurrency group. Deliberately no concurrency block
# here: this job is a few seconds of git work, so any number of these can be
# queued back-to-back (schedule, manual, winners, non-winners, all mixed)
# without GitHub silently dropping earlier ones. See queue_runner.yml and
# src/queue_worker.py for why this exists and how draining/chunking works.
permissions:
  contents: write
  actions: write

jobs:
  enqueue-winners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Append job(s) to shared run queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            # Defensive: force the working tree to exactly match whatever is
            # currently checked out before pulling. Without this, any
            # pre-existing diff in a tracked file (e.g. a line-ending quirk
            # in one of the selection-counts JSON files) makes git refuse to
            # even start "pull --rebase" with "You have unstaged changes",
            # before this script has touched anything itself.
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin "${{ github.ref_name }}"

            JOB_IDS=$(python src/queue_worker.py enqueue-range \
              --job-type winners \
              --date "${{ github.event.inputs.date }}" \
              --start-date "${{ github.event.inputs.start_date }}" \
              --end-date "${{ github.event.inputs.end_date }}" \
              --chunk-days "${{ github.event.inputs.chunk_days }}" \
              --top-n "${{ github.event.inputs.top_n || '15' }}" \
              --allow-append "${{ github.event.inputs.allow_append || 'false' }}" \
              --queued-by "winners:${{ github.run_id }}")

            git add -f data/run_queue.jsonl
            NUM_JOBS=$(echo "$JOB_IDS" | grep -c .)
            git commit -m "chore: enqueue $NUM_JOBS winners job(s) [skip ci]"

            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Enqueued:"
              echo "$JOB_IDS"
              break
            fi

            echo "Push attempt $i failed (likely a race with another enqueue), retrying..."
            git reset --hard HEAD~1
            sleep $((RANDOM % 5 + 2))
          done

      - name: Wake up the queue runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run queue_runner.yml --ref "${{ github.ref_name }}"

# TradingView Analysis Configuration

# Supabase Settings (Primary Data Store)
supabase:
  # URL and Key are read from SUPABASE_URL and SUPABASE_KEY environment variables
  # Do NOT put secrets in this file.
  
  # Table names
  candidates_table: "candidates"
  raw_data_table: "raw_data"
  analysis_table: "analysis"
  summary_table: "summary_stats"
  
  # Sample size for Google Sheets validation
  sheets_sample_size: 0 # currently set to 0, google sheets is used as a fallback

# Google Sheets Settings (Sample Data for Validation Only)
google_sheets:
  spreadsheet_id: "1rgJQiGk6eKc1Eks9cyn0X9ukkA3C6nk44QDMamPGwC0"
  # Credentials are read from the GOOGLE_CREDENTIALS_JSON environment variable.
  # Do NOT put secrets in this file.
  
  # Sheet names
  sheets:
    candidates: "Candidates"
    raw_data: "Raw Data"  # Base name - will create Raw Data_T-1, Raw Data_T-3, etc.
    analysis: "Analysis_Raw"
    summary: "Summary Stats"

# Event Detection Settings
detection:
  # Spiker: Single-day move > threshold
  spiker_threshold: 15.0  # percent
  
  # Grinder: Consecutive days > threshold
  grinder_days: 3
  grinder_threshold: 0.5  # percent per day
  
  # Stock universe
  exchanges:
    - "NASDAQ"
    - "NYSE"
    - "AMEX"
  
  # Minimum requirements
  min_price: 0.50  # Exclude penny stocks below this
  min_volume: 100000  # Minimum daily volume
  
  # Lookback period for detection
  lookback_days: 7  # How many days to scan

# Technical Indicators to Track
indicators:
  # Exact names as they appear in TradingView
  - name: "Stochastic RSI (3,3,14,14)"
    column: "Stoch.RSI.K"
  - name: "Williams Percent Range (14)"
    column: "W.R"
  - name: "Relative Volume"
    column: "relative_volume_10d_calc"
  - name: "Pre-market Gap %"
    column: "premarket_gap"
  - name: "Average True Range % (14)"
    column: "ATR"
  - name: "Exponential Moving Average (50)"
    column: "EMA50"
  - name: "Volume"
    column: "volume"
  - name: "Price"
    column: "close"
  - name: "Change %"
    column: "change"

# Time Lags to Collect (days before event)
time_lags:
  - 1   # T-1 (previous day)
  - 3   # T-3
  - 5   # T-5
  - 10  # T-10
  - 30  # T-30

# Rate Limiting Settings
rate_limiting:
  # Requests per minute, shared across ALL worker threads via a single global
  # RateLimiter/lock (see src/rate_limiter.py). Raised from 30 -> 90: at 30,
  # the 20-worker ThreadPoolExecutors used for scanning (SCAN_WORKERS=20 in
  # both detectors) were bottlenecked to ~1 request every 2s system-wide
  # regardless of thread count, so the extra workers were mostly idle. Start
  # here and watch the logs for repeated 429/backoff warnings from
  # call_with_backoff -- if you see many, dial this back down; if none,
  # you likely have more headroom to raise it further.
  requests_per_minute: 90
  
  # Delay between individual symbol requests (seconds)
  delay_between_symbols: 2.0
  
  # Batch size for bulk operations
  batch_size: 10
  
  # Retry settings
  max_retries: 3
  retry_delay: 5  # seconds
  exponential_backoff: true

# Logging Settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/analysis.log"
  console: true

# Analysis Settings
analysis:
  # Minimum samples for statistical validity
  min_samples: 10
  
  # Confidence level for statistical tests
  confidence_level: 0.95
  
  # Include correlation analysis
  compute_correlations: true
  
  # Generate visualizations (for future dashboard)
  generate_charts: false

# Data Persistence
persistence:
  # Cache directory for intermediate results
  cache_dir: "data/cache"
  
  # Export raw data to CSV backup
  export_csv: false
  export_dir: "data/exports"
  
  # Retention period (days)
  retention_days: 90



# Daily Winners Tracker Configuration
# Add this to your existing config.yaml

# Daily Winners Settings (Separate from spike/grinder analysis)
daily_winners:
  # Supabase table names for daily winners data
  winners_table: "daily_winners"
  market_open_table: "winners_market_open"
  market_close_table: "winners_market_close"
  day_prior_open_table: "winners_day_prior_open"
  day_prior_close_table: "winners_day_prior_close"
  skip_freshness_validation: false # Trust TradingView, skip yfinance checks
  
  # Number of top winners to track daily
  top_n: 15
  
  # Market times (NYC timezone)
  market_open_time: "09:30:00"
  market_close_time: "16:00:00"



# ============================================================================
# NON-WINNERS TRACKER CONFIGURATION
# ============================================================================
non_winners:
  # How many times to retry with loosened filters before giving up and falling
  # back to the random-liquid-stock method.  0 = no loosening, just full filters
  # then immediate fallback.
  loosening_passes: 5

  # How much to relax every min_* and max_* filter threshold per pass, as a
  # percentage.  At pass N the filters are relaxed by (loosening_step_pct * N)%.
  #   e.g. step=20, pass 1 → -20% on all min_ thresholds, +20% on all max_
  #        step=20, pass 2 → -40% / +40%, and so on.
  loosening_step_pct: 20.0

  # Stop loosening early once the candidate pool reaches (top_n * min_pool_factor).
  # Raise this if you want a more diverse pool before sampling; lower it to save
  # API calls on low-activity days.
  min_pool_factor: 1.5

  # Retraining: target fraction of negatives per date that should come from the
  # filtered pool (hard negatives) before loosening stops for that date.
  # 0.80 = aim for 80% hard negatives; the rest are filled with unfiltered rows.
  min_hard_neg_ratio: 0.85

# ============================================================================
# BACKTESTING CONFIGURATION
# ============================================================================
backtesting:
  # Number of parallel workers for backtesting
  max_workers: 10
  
  # Delay between requests (seconds)
  request_delay: 0.5
  
  # Number of top gainers to check per day
  top_gainers_per_day: 20
  
  # Number of criteria matches to check per day
  criteria_matches_per_day: 20

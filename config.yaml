# TradingView Analysis Configuration

# Supabase Settings (Primary Data Store)
supabase:
  # URL and Key are read from SUPABASE_URL and SUPABASE_KEY environment variables
  # Do NOT put secrets in this file.
  
  # Table names
  candidates_table: "candidates"
  raw_data_table: "raw_data"
  analysis_table: "analysis"
  summary_table: "summary_stats"
  
  # Sample size for Google Sheets validation
  sheets_sample_size: 0 # currently set to 0, google sheets is used as a fallback

# Google Sheets Settings (Sample Data for Validation Only)
google_sheets:
  spreadsheet_id: "1rgJQiGk6eKc1Eks9cyn0X9ukkA3C6nk44QDMamPGwC0"
  # Credentials are read from the GOOGLE_CREDENTIALS_JSON environment variable.
  # Do NOT put secrets in this file.
  
  # Sheet names
  sheets:
    candidates: "Candidates"
    raw_data: "Raw Data"  # Base name - will create Raw Data_T-1, Raw Data_T-3, etc.
    analysis: "Analysis_Raw"
    summary: "Summary Stats"

# Event Detection Settings
detection:
  # Spiker: Single-day move > threshold
  spiker_threshold: 15.0  # percent
  
  # Grinder: Consecutive days > threshold
  grinder_days: 3
  grinder_threshold: 0.5  # percent per day
  
  # Stock universe
  exchanges:
    - "NASDAQ"
    - "NYSE"
    - "AMEX"
  
  # Minimum requirements
  min_price: 0.50  # Exclude penny stocks below this
  min_volume: 100000  # Minimum daily volume
  
  # Lookback period for detection
  lookback_days: 7  # How many days to scan

# Technical Indicators to Track
indicators:
  # Exact names as they appear in TradingView
  - name: "Stochastic RSI (3,3,14,14)"
    column: "Stoch.RSI.K"
  - name: "Williams Percent Range (14)"
    column: "W.R"
  - name: "Relative Volume"
    column: "relative_volume_10d_calc"
  - name: "Pre-market Gap %"
    column: "premarket_gap"
  - name: "Average True Range % (14)"
    column: "ATR"
  - name: "Exponential Moving Average (50)"
    column: "EMA50"
  - name: "Volume"
    column: "volume"
  - name: "Price"
    column: "close"
  - name: "Change %"
    column: "change"

# Time Lags to Collect (days before event)
time_lags:
  - 1   # T-1 (previous day)
  - 3   # T-3
  - 5   # T-5
  - 10  # T-10
  - 30  # T-30

# Rate Limiting Settings
rate_limiting:
  # Requests per minute to TradingView
  requests_per_minute: 30
  
  # Delay between individual symbol requests (seconds)
  delay_between_symbols: 2.0
  
  # Batch size for bulk operations
  batch_size: 10
  
  # Retry settings
  max_retries: 3
  retry_delay: 5  # seconds
  exponential_backoff: true

# Logging Settings
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/analysis.log"
  console: true

# Analysis Settings
analysis:
  # Minimum samples for statistical validity
  min_samples: 10
  
  # Confidence level for statistical tests
  confidence_level: 0.95
  
  # Include correlation analysis
  compute_correlations: true
  
  # Generate visualizations (for future dashboard)
  generate_charts: false

# Data Persistence
persistence:
  # Cache directory for intermediate results
  cache_dir: "data/cache"
  
  # Export raw data to CSV backup
  export_csv: false
  export_dir: "data/exports"
  
  # Retention period (days)
  retention_days: 90



# Daily Winners Tracker Configuration
# Add this to your existing config.yaml

# Daily Winners Settings (Separate from spike/grinder analysis)
daily_winners:
  # Supabase table names for daily winners data
  winners_table: "daily_winners"
  market_open_table: "winners_market_open"
  market_close_table: "winners_market_close"
  day_prior_table: "winners_day_prior"
  
  # Number of top winners to track daily
  top_n: 10
  
  # Market times (NYC timezone)
  market_open_time: "09:30:00"
  market_close_time: "16:00:00"


# ============================================================================
# BACKTESTING CONFIGURATION
# ============================================================================
backtesting:
  # Supabase table names for backtesting
  strategies_table: "backtest_strategies"
  results_table: "backtest_results"
  trades_table: "backtest_trades"
  
  # Default parameters
  defaults:
    target_min_gain_pct: 5.0
    target_days: 1
    min_price: 0.50
    min_volume: 100000
    exchanges:
      - "NASDAQ"
      - "NYSE"
      - "AMEX"
    # NEW: Control how many stocks to analyze
    top_winners_count: 10  # How many top winners to track per day
    max_criteria_matches: 50  # Max stocks to analyze that match criteria
  
  # Performance settings
  max_workers: 5  # Parallel processing threads
  lookback_days: 120  # Historical data to fetch
  cache_enabled: true  # Cache historical data
  
  # Available indicators for strategy criteria
  # These are the indicators users can select in the UI
  available_indicators:
    - rsi
    - macd
    - macd_signal
    - stoch_k
    - stoch_d
    - adx
    - volume
    - volume_ratio
    - volume_sma_20
    - close
    - open
    - high
    - low
    - ema_10
    - ema_20
    - ema_50
    - ema_200
    - sma_10
    - sma_20
    - sma_50
    - sma_200
    - bb_upper
    - bb_lower
    - bb_middle
    - atr
